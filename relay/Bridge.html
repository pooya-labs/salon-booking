<!doctype html>
<html lang="fa">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      'use strict';
      var PARENT_ORIGIN = 'https://pooya-labs.github.io';
      var sendToTop = function (message) {
        window.top.postMessage(message, PARENT_ORIGIN);
      };

      window.addEventListener('message', function (event) {
        if (event.source !== window.top || event.origin !== PARENT_ORIGIN) return;
        var message = event.data;
        if (!message || message.type !== 'SALON_RELAY_REQUEST' || !message.id) return;
        google.script.run
          .withSuccessHandler(function (result) {
            sendToTop({ type: 'SALON_RELAY_RESPONSE', id: message.id, result: result });
          })
          .withFailureHandler(function () {
            sendToTop({
              type: 'SALON_RELAY_RESPONSE', id: message.id,
              result: { status: 502, body: JSON.stringify({
                ok: false, error: 'apps_script_error',
                message: 'درگاه رزرو نتوانست درخواست را پردازش کند.'
              })}
            });
          })
          .proxyRequest(message.request);
      });

      sendToTop({ type: 'SALON_RELAY_READY' });
    }());
  </script>
</head>
<body></body>
</html>
