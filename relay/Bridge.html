<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <script>
      window.addEventListener('message', function (event) {
        if (event.source !== window.parent) return
        var message = event.data
        if (!message || message.type !== 'SALON_RELAY_REQUEST' || !message.id) return

        google.script.run
          .withSuccessHandler(function (result) {
            window.parent.postMessage({
              type: 'SALON_RELAY_RESPONSE',
              id: message.id,
              result: result
            }, '*')
          })
          .withFailureHandler(function () {
            window.parent.postMessage({
              type: 'SALON_RELAY_RESPONSE',
              id: message.id,
              result: {
                status: 502,
                body: JSON.stringify({ message: 'درگاه واسط نتوانست درخواست را پردازش کند.' })
              }
            }, '*')
          })
          .proxyRequest(message.request)
      })
      window.parent.postMessage({ type: 'SALON_RELAY_READY' }, '*')
    </script>
  </head>
  <body></body>
</html>
