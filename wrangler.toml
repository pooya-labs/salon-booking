name = "salon-booking"
main = "worker/index.ts"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/admin", "/admin/"]

[[d1_databases]]
binding = "DB"
database_name = "salon-booking"
# Replace after creating the D1 database in your Cloudflare account.
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
