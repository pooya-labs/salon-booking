name = "salon-booking"
main = "worker/index.ts"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/admin", "/admin/"]

[[d1_databases]]
binding = "DB"
database_name = "salon-booking"
# Replace after creating the D1 database in your Cloudflare account.
database_id = "646e31ad-82c9-45bf-8afc-ed6e6b81e025"
migrations_dir = "migrations"
