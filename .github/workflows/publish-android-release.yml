name: Publish Android Manager Release

on:
  push:
    branches: [main]
    paths:
      - ".release/v1.2.0"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: salon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Inject private Firebase Android configuration
        env:
          FIREBASE_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_JSON" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is required for a Firebase-enabled build."
            exit 1
          fi
          echo "$FIREBASE_JSON" | base64 --decode > android/app/google-services.json
      - name: Build and test Android manager
        env:
          SALON_RELAY_URL: ${{ vars.SALON_RELAY_URL }}
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Shayan Barber Studio v1.2.0
          tag_name: v1.2.0
          target_commitish: main
          prerelease: true
          generate_release_notes: true
          body: |
            ## Shayan Barber Studio — Android 1.2.0

            This is the Firebase-configured, automated-test-passing **debug-signed APK** for Shayan Barber Studio. It includes the renamed Android app identity, persistent System / Light / Dark appearance modes, theme-aware Material 3 surfaces, adaptive system bars and restrained navigation motion. The latest APK still requires a physical-device smoke test for both themes and notification delivery before broad distribution.

            **Important:** this is a prerelease/debug build, not a production-signed APK. It is intended for direct installation by the manager. A future update signed with a different key cannot update this installation in place; uninstalling may remove local app data.

            The booking website and Apps Script backend remain the existing production services.
          files: android/app/build/outputs/apk/debug/app-debug.apk
