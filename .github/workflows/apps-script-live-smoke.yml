name: Apps Script live relay smoke

on:
  workflow_run:
    workflows: ["Deploy preview to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apps-script-live-smoke
  cancel-in-progress: false

jobs:
  read-only-smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && vars.SALON_RELAY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the exact Pages deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install pinned Chromium test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify published Pages to Apps Script relay (read-only)
        env:
          SALON_RELAY_URL: ${{ vars.SALON_RELAY_URL }}
          SALON_BOOKING_PAGES_URL: https://pooya-labs.github.io/salon-booking/
        run: npm run test:apps-script:live
