name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint source
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: SQLite migration and conflict tests
        run: npm run test:migrations
      - name: Typecheck and build
        run: npm run build
      - name: Cloudflare Worker + local D1 integration tests
        run: npm run test:worker
      - name: Install pinned browser-test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.14.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build static demo for browser QA
        run: npm run build:pages
      - name: Responsive, RTL, keyboard and browser QA
        run: npm run test:browser
      - name: Build production assets for owner dashboard QA
        run: npm run build
      - name: Owner dashboard date-range browser QA
        run: npm run test:browser:admin
